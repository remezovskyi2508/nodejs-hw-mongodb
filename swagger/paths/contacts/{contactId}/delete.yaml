summary: Delete contact by id
operationId: deleteContactById
description: 'Delete contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
responses:
  '204':
    description: 'Delete by contactId'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
          properties:
            status:
              type: integer
              example: 204
  '401':
    $ref: ../../../components/responses/contacts/401.yaml
  '404':
    $ref: ../../../components/responses/contacts/{contactId}/delete404.yaml
